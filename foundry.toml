[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc = "0.8.33"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[fmt]
line_length = 120
tab_width = 4

[fuzz]
runs = 1000

[invariant]
runs = 256
depth = 50
fail_on_revert = true

[profile.security.fuzz]
runs = 10000

[profile.security.invariant]
runs = 256
depth = 100
fail_on_revert = true
